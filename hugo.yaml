baseURL: "https://yourusername.github.io/"
languageCode: "en-us"
title: "My Blog"
theme: "PaperMod"

pagination:
  pagerSize: 10

enableRobotsTXT: true
buildDrafts: false
buildFuture: false
buildExpired: false

googleAnalytics: ""

minify:
  disableXML: true

taxonomies:
  category: categories
  tag: tags

params:
  env: production
  title: "My Blog"
  description: "Notes on space, cybersecurity, and other random topics."
  keywords: [Blog, Space, Cybersecurity, Technology]
  author: "Mehedi"
  defaultTheme: auto
  ShowShareButtons: true
  ShowReadingTime: true
  ShowPostNavLinks: true
  ShowBreadCrumbs: true
  ShowCodeCopyButtons: true
  ShowWordCount: true
  ShowRssButtonInSectionTermList: true
  UseHugoToc: true
  disableSpecial1stPost: false
  disableScrollToTop: false
  comments: false
  hidemeta: false
  hideSummary: false
  showtoc: true
  tocopen: false

  homeInfoParams:
    Title: "Welcome"
    Content: "Writing about space, cybersecurity, and whatever else is interesting."

  socialIcons:
    - name: github
      url: "https://github.com/yourusername"

  assets:
    disableHLJS: false
    favicon: "/favicon.ico"

  cover:
    hidden: false
    hiddenInList: false
    hiddenInSingle: false

menu:
  main:
    - identifier: space
      name: Space
      url: /categories/space/
      weight: 10
    - identifier: cybersecurity
      name: Cybersecurity
      url: /categories/cybersecurity/
      weight: 20
    - identifier: random
      name: Random
      url: /categories/random/
      weight: 30
    - identifier: archives
      name: Archive
      url: /archives/
      weight: 40
    - identifier: search
      name: Search
      url: /search/
      weight: 50

markup:
  highlight:
    noClasses: false
  goldmark:
    renderer:
      unsafe: true
